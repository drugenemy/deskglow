<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裏 ura — Deskglow</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070807; cursor: none; }
  body.web { cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; inset: auto 20px 20px auto; display: none; gap: 10px; font: 500 13px/1 "Segoe UI", system-ui, sans-serif; }
  body.web #ui { display: flex; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 999px; cursor: pointer;
          color: #efe9da; background: rgba(12,14,12,.62); border: 1px solid rgba(230,224,207,.25);
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-decoration: none; letter-spacing: .02em; }
  .pill:hover { background: rgba(30,36,30,.75); border-color: rgba(230,224,207,.5); }
  .pill.main { background: #e6e0cf; color: #0b0c0b; border-color: transparent; }
  .pill.main:hover { background: #fff; }
  #hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: none; pointer-events: none;
          font: 400 12px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase;
          color: rgba(239,233,218,.75); background: rgba(10,12,10,.45); padding: 9px 14px; border-radius: 999px; transition: opacity 1.2s; }
  body.web #hint { display: block; }
  #drop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(8,10,8,.6); pointer-events: none;
          font: 300 28px/1.2 "Segoe UI", system-ui, sans-serif; color: #efe9da; letter-spacing: .06em; }
  #drop.on { display: grid; }
  @media (max-width: 700px) { #ui { inset: auto 12px 12px 12px; justify-content: center; } #hint { display: none !important; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <a class="pill" href="https://github.com/drugenemy/deskglow/releases/latest" target="_blank" rel="noopener">Get it for Windows ↗</a>
  <label class="pill main">＋ Use your image<input id="file" type="file" accept="image/*" multiple hidden></label>
</div>
<div id="hint">move the mouse · click · double-click for next scene · drop an image</div>
<div id="drop">Drop your image — it becomes a wallpaper</div>
<script src="scenes.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  裏 (ura) — a Deskglow wallpaper. "Everything has a hidden side."
//
//  Diagonal bands sweep across the screen. A full sweep covers the screen, swaps
//  the scene underneath, and slides away. Each scene has a living layer (smoke,
//  sparks, fireflies, petals). A slit under the mouse shows a pencil sketch that
//  the code draws from the art itself: the hidden side.
//
//  Mouse      depth (parallax), pushes smoke and particles, reveals the sketch
//  Click      裏 seal + burst
//  Dbl-click  next scene
//  Settings   scenes.js
// ─────────────────────────────────────────────────────────────────────────────
const CFG = Object.assign({ angle: 62, cutEvery: 14, sceneEvery: 120, name: 'DESKGLOW', sign: '裏側',
  signLines: ['THE OTHER SIDE', ''], words: ['裏'], scenes: [], bandImages: [] }, window.URA || {});
const SCENES = CFG.scenes.map(s => ({ ...s }));
const BAND_IMAGES = [...CFG.bandImages];
const WEB = !(window.chrome && window.chrome.webview);   // running in a normal browser, not on the desktop
if (WEB) document.body.classList.add('web');

const PAL = { ink: '#070807', inkRGB: [14, 15, 13], bone: '#e6e0cf', paper: [236, 230, 214], moss: '#2f3f2b', seal: '#a3291c' };
const JP = '"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif CJK JP","Noto Serif JP","IPAMincho",serif';
const COND = '"Bahnschrift","Oswald","Arial Narrow",sans-serif';
const SERIF = '"Cormorant Garamond","Garamond","Georgia",serif';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, K = 1;
let U, N, TR, SR;
const IMG = {}, SKETCH = new Map();
let scene, sceneIdx = 0, art, layerBase, layerArt, layerPaper, grainPat, grainCanvas, dotSprite;
const smoke = document.createElement('canvas'), sctx = smoke.getContext('2d');
let smokeData = null;

const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeIO = t => t < .5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const fg = (a = 1) => scene.light ? rgb(PAL.inkRGB, a) : `rgba(230,224,207,${a})`;
const hex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');

// ── read colors from an image: background from its edges, accent from its most colorful pixels ──
function analyze(img) {
  const w = 48, h = Math.max(8, Math.round(48 * img.naturalHeight / img.naturalWidth));
  const c = mk(w, h), g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  let er = 0, eg = 0, eb = 0, en = 0; const cols = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4, r = d[i], gg = d[i + 1], b = d[i + 2];
    if (x < 2 || y < 2 || x >= w - 2 || y >= h - 2) { er += r; eg += gg; eb += b; en++; }
    const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), sat = mx ? (mx - mn) / mx : 0;
    if (sat > .3 && mx > 70 && mx < 245) cols.push([sat * mx, r, gg, b]);
  }
  const bg = [er / en, eg / en, eb / en];
  const light = (bg[0] * .3 + bg[1] * .59 + bg[2] * .11) > 140;
  cols.sort((a, b) => b[0] - a[0]);
  const top = cols.slice(0, Math.max(1, Math.round(cols.length * .08)));
  const accent = cols.length > 6 ? hex([0, 1, 2].map(k => top.reduce((s, c) => s + c[k + 1], 0) / top.length)) : (light ? '#3f5f45' : '#8fae93');
  return { bg, light, accent };
}
function completeScene(s) {
  const a = analyze(IMG[s.img]);
  s.bg ??= a.bg; s.light ??= a.light; s.accent ??= a.accent;
  s.side ??= (IMG[s.img].naturalWidth > IMG[s.img].naturalHeight * 1.2 ? 'flush' : 'right');
  s.fade ??= s.side === 'left' ? [.03, .3, .04, .06] : s.side === 'flush' ? [.32, 0, .04, 0] : [.28, .12, .04, .1];
  s.title ??= '裏'; s.label ??= 'SCENE'; s.quote ??= ['Everything has', 'another side.'];
  s.fx ??= 'none';
  s.smoke ??= s.light ? [40, 40, 36] : [150, 160, 150];
  return s;
}

// ── the hidden side: colored-pencil sketch drawn from the image ──
function makeSketch(img) {
  const sc = Math.min(1, 1400 / img.naturalHeight);
  const w = Math.round(img.naturalWidth * sc), h = Math.round(img.naturalHeight * sc);
  const c = mk(w, h), g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, L = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) L[i] = (d[i * 4] * .3 + d[i * 4 + 1] * .59 + d[i * 4 + 2] * .11) / 255;
  const out = g.createImageData(w, h), o = out.data, P = PAL.paper;
  for (let y = 0; y < h; y++) {
    const y0 = Math.max(0, y - 1) * w, y1 = y * w, y2 = Math.min(h - 1, y + 1) * w;
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - 1), x2 = Math.min(w - 1, x + 1), i = y1 + x;
      const gx = -L[y0+x0] - 2*L[y1+x0] - L[y2+x0] + L[y0+x2] + 2*L[y1+x2] + L[y2+x2];
      const gy = -L[y0+x0] - 2*L[y0+x] - L[y0+x2] + L[y2+x0] + 2*L[y2+x] + L[y2+x2];
      const line = Math.pow(clamp((Math.sqrt(gx * gx + gy * gy) - .08) / .34), .8);
      const lum = L[i];
      const tone = smooth(.03, .14, lum) * (1 - lum) * .22 * ((x + y) % 4 === 0 ? 1 : .25);
      const a = clamp(line * .92 + tone);
      const r = d[i*4], gg = d[i*4+1], b = d[i*4+2], m = (r + gg + b) / 3;
      const lr = lerp(48, clamp(m + (r - m) * 2.4, 0, 255) * .8, .45);
      const lg = lerp(50, clamp(m + (gg - m) * 2.4, 0, 255) * .8, .45);
      const lb = lerp(56, clamp(m + (b - m) * 2.4, 0, 255) * .8, .45);
      o[i*4] = lerp(P[0], lr, a); o[i*4+1] = lerp(P[1], lg, a); o[i*4+2] = lerp(P[2], lb, a); o[i*4+3] = 255;
    }
  }
  g.putImageData(out, 0, 0);
  return c;
}
const sketchOf = s => SKETCH.get(s) || (SKETCH.set(s, makeSketch(IMG[s.img])), SKETCH.get(s));

function maskedArt(img, w, h, [l, r, t, b]) {
  const c = mk(w, h), g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, 0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in';
  const fade = (x0, y0, x1, y1, a, z) => {
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, `rgba(0,0,0,${a ? 0 : 1})`); gr.addColorStop(a || .0001, 'rgba(0,0,0,1)');
    gr.addColorStop(1 - (z || .0001), 'rgba(0,0,0,1)'); gr.addColorStop(1, `rgba(0,0,0,${z ? 0 : 1})`);
    g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  };
  fade(0, 0, c.width, 0, l, r);
  fade(0, 0, 0, c.height, t, b);
  return c;
}

// ── layout ──
function layout() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight; K = Math.min(H / 1080, W / 1100);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const th = CFG.angle * Math.PI / 180;
  U = { x: Math.cos(th), y: Math.sin(th) };
  N = { x: -Math.sin(th), y: Math.cos(th) };
  const corners = [[0, 0], [W, 0], [0, H], [W, H]];
  const ts = corners.map(([x, y]) => x * U.x + y * U.y), ss = corners.map(([x, y]) => x * N.x + y * N.y);
  TR = [Math.min(...ts) - 40, Math.max(...ts) + 40];
  SR = [Math.min(...ss), Math.max(...ss)];
  const sw = 176, sh = Math.max(40, Math.round(176 * H / W));
  smoke.width = sw; smoke.height = sh; smokeData = sctx.createImageData(sw, sh);
  buildScene();
}

function buildScene() {
  const img = IMG[scene.img], ratio = img.naturalWidth / img.naturalHeight;
  const narrow = W < H;                      // phones / portrait screens: art fills, text on top
  let ah = H + 30 * K, aw = ah * ratio;
  if (narrow && aw < W) { aw = W + 30 * K; ah = aw / ratio; }
  let x;
  if (narrow) x = (W - aw) / 2;
  else if (scene.side === 'left') x = -14 * K;
  else if (scene.side === 'flush') x = W - aw + 14 * K;
  else x = Math.min(W * .64 - aw / 2, W - aw - 40 * K);
  art = { x, y: H - ah + 14 * K, w: aw, h: ah };
  art.free = narrow ? [0, W] : scene.side === 'left' ? [art.x + aw * .92, W] : [0, Math.max(W * .3, art.x + aw * .12)];
  layerArt = maskedArt(img, aw * DPR, ah * DPR, narrow ? [0, 0, .25, 0] : scene.fade);
  buildBase();
  buildPaper();
}

function txt(g, s, x, y, font, color, o = {}) {
  g.save();
  g.font = font; g.fillStyle = color; g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic';
  if (o.spacing) g.letterSpacing = o.spacing;
  g.globalAlpha = o.alpha ?? 1;
  g.fillText(s, x, y);
  g.restore();
}
function vtxt(g, s, x, y, size, color, gap = 1.12) {
  for (let i = 0; i < s.length; i++) txt(g, s[i], x, y + i * size * gap, `500 ${size}px ${JP}`, color, { align: 'center', base: 'top' });
}

function buildBase() {
  layerBase = mk(cv.width, cv.height);
  const g = layerBase.getContext('2d');
  g.scale(DPR, DPR);
  g.fillStyle = rgb(scene.bg); g.fillRect(0, 0, W, H);
  const v = g.createRadialGradient(W * .5, H * .45, H * .1, W * .5, H * .5, Math.max(W, H) * .75);
  v.addColorStop(0, scene.light ? 'rgba(255,250,240,.35)' : 'rgba(40,52,38,.22)'); v.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);

  const [f0, f1] = art.free, fw = f1 - f0;
  const x0 = scene.side === 'left' && W >= H ? f0 + 40 * K : 64 * K;

  txt(g, scene.title, f0 + fw * .5, H * .52, `600 ${Math.min(620 * K, fw * .9)}px ${JP}`, scene.accent,
      { align: 'center', base: 'middle', alpha: scene.light ? .07 : .06 });

  g.save();
  g.font = `200 ${330 * K}px ${COND}`; g.fontStretch = 'condensed'; g.letterSpacing = `${6 * K}px`;
  const fit = (fw - 80 * K) / g.measureText(CFG.name).width;
  g.font = `200 ${330 * K * Math.min(1, fit)}px ${COND}`;
  g.strokeStyle = fg(.13); g.lineWidth = 1.2 * K;
  g.strokeText(CFG.name, x0 - 10 * K, H - 46 * K);
  g.restore();

  const by = 64 * K, sh = (CFG.sign.length * 1.4 + .5) * 30 * K;
  g.strokeStyle = fg(.55); g.lineWidth = 1;
  g.strokeRect(x0, by, 46 * K, sh);
  vtxt(g, CFG.sign, x0 + 23 * K, by + 16 * K, 30 * K, fg(), 1.4);
  txt(g, CFG.signLines[0] || '', x0 + 70 * K, by + 18 * K, `500 ${13 * K}px ${COND}`, fg(), { spacing: `${4 * K}px`, base: 'top' });
  txt(g, CFG.signLines[1] || '', x0 + 70 * K, by + 40 * K, `400 ${11 * K}px ${COND}`, fg(.5), { spacing: `${3 * K}px`, base: 'top' });
  g.fillStyle = scene.accent; g.fillRect(x0 + 70 * K, by + 66 * K, 28 * K, 2 * K);

  const idx = String(sceneIdx + 1).padStart(2, '0');
  txt(g, `${idx} / ${String(SCENES.length).padStart(2, '0')}  —  ${scene.label}`, x0 + 70 * K, by + 96 * K,
      `400 ${11 * K}px ${COND}`, fg(.6), { spacing: `${3 * K}px`, base: 'top' });
  const qy = H * .5 + 120 * K;
  g.fillStyle = scene.accent; g.fillRect(x0 + 4 * K, qy, 2 * K, 52 * K);
  scene.quote.forEach((q, i) => txt(g, i ? `${q}”` : `“${q}`, x0 + 20 * K, qy + 18 * K + i * 26 * K, `italic 400 ${20 * K}px ${SERIF}`, fg(.85)));
}

function buildPaper() {
  layerPaper = mk(cv.width, cv.height);
  const g = layerPaper.getContext('2d');
  g.scale(DPR, DPR);
  g.fillStyle = rgb(PAL.paper); g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(70,110,170,.17)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 48 * K) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 48 * K) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  const ax = clamp(art.x, 0, Math.max(0, W - 200 * K));
  g.strokeStyle = 'rgba(200,60,50,.35)'; g.strokeRect(ax + 30 * K, 40 * K, Math.min(art.w, W - ax) - 60 * K, H - 80 * K);
  txt(g, `C-${120 + sceneIdx * 7}`, ax + 44 * K, 78 * K, `600 ${26 * K}px ${COND}`, 'rgba(190,50,40,.75)');
  txt(g, `裏 ${'ABCDEFGHIJ'[sceneIdx % 10]}`, ax + 44 * K, 112 * K, `500 ${20 * K}px ${JP}`, 'rgba(50,90,170,.7)');
  txt(g, 'TIMING 6 / 8', ax + 44 * K, 140 * K, `600 ${16 * K}px ${COND}`, 'rgba(190,50,40,.55)');
}

function buildSprites() {
  const c = mk(220, 220), g = c.getContext('2d'), id = g.createImageData(220, 220);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; }
  g.putImageData(id, 0, 0);
  grainCanvas = c;
  grainPat = ctx.createPattern(c, 'repeat');
  dotSprite = mk(64, 64);
  const d = dotSprite.getContext('2d'), gr = d.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.4, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  d.fillStyle = gr; d.fillRect(0, 0, 64, 64);
}
const tinted = {};
function sprite(color) {
  const k = color.join(',');
  if (tinted[k]) return tinted[k];
  const c = mk(64, 64), g = c.getContext('2d');
  g.drawImage(dotSprite, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = rgb(color); g.fillRect(0, 0, 64, 64);
  return tinted[k] = c;
}

// ── mouse ──
const mouse = { x: innerWidth / 2, y: innerHeight / 2, vx: 0, vy: 0, last: -1e9 };
const par = { x: 0, y: 0 };
let trail = [];
function onMove(cx, cy) {
  const now = performance.now();
  const dx = cx - mouse.x, dy = cy - mouse.y;
  mouse.vx = lerp(mouse.vx, dx, .5); mouse.vy = lerp(mouse.vy, dy, .5);
  mouse.x = cx; mouse.y = cy; mouse.last = now;
  if (Math.hypot(dx, dy) > 2) {
    trail.push({ x: cx / W, y: cy / H, vx: dx / W, vy: dy / H, t: now });
    if (trail.length > 20) trail.shift();
  }
  if (lens.x < -1e3) { lens.x = cx; lens.y = cy; }
}
addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
addEventListener('touchmove', e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
let seals = [], lastClick = { t: -1e9, x: 0, y: 0 };
addEventListener('click', e => {
  if (e.target.closest && e.target.closest('#ui')) return;
  const now = performance.now();
  if (now - lastClick.t < 380 && Math.hypot(e.clientX - lastClick.x, e.clientY - lastClick.y) < 40) {
    lastClick.t = -1e9;
    nextScene(now);
    return;
  }
  lastClick = { t: now, x: e.clientX, y: e.clientY };
  seals.push({ x: e.clientX, y: e.clientY, start: now, rot: rand(-.14, .06) });
  burst(e.clientX, e.clientY);
  for (let i = 0; i < 6; i++) trail.push({ x: e.clientX / W, y: e.clientY / H, vx: rand(-.02, .02), vy: rand(-.02, .02), t: now, big: 1 });
});

// ── smoke: domain-warped value noise; the mouse trail pushes and clears it ──
function hash(i, j) {
  let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) & 0xffff) / 65535;
}
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) { let s = 0, a = .5; for (let o = 0; o < 3; o++) { s += a * noise(x, y); x *= 2.03; y *= 2.03; a *= .5; } return s / .875; }
function updateSmoke(t) {
  const sw = smoke.width, sh = smoke.height, d = smokeData.data, [r, g, b] = scene.smoke;
  const tt = t * .00004, asp = H / W;
  trail = trail.filter(p => t - p.t < 2600);
  const live = trail.map(p => ({ ...p, life: 1 - (t - p.t) / 2600, r2: (p.big ? .012 : .004) }));
  const light = scene.light;
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const u = x / sw, v = y / sh;
    let ox = 0, oy = 0, clear = 0;
    for (const p of live) {
      const dx = u - p.x, dy = (v - p.y) * asp, d2 = dx * dx + dy * dy;
      if (d2 > p.r2 * 9) continue;
      const f = Math.exp(-d2 / p.r2) * p.life;
      ox -= p.vx * f * 30 + dy * f * 2.2; oy -= p.vy * f * 30 - dx * f * 2.2;
      clear = Math.max(clear, f);
    }
    const px = (u + ox) * 4.2, py = (v + oy) * 4.2 * asp * 1.6;

    const n = fbm(px + 2.2 * qx + tt * 2, py + 2.2 * qy - tt * 3);

    s.fx = s.light ? 'petals' : 'fireflies';
    SCENES.push(s); BAND_IMAGES.push(url);
    if (first == null) first = SCENES.length - 1;
  }
  if (first != null) { pendingSwap = null; nextScene(performance.now(), first); }
}
document.getElementById('file').addEventListener('change', e => addImages([...e.target.files]));
const drop = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('on'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) drop.classList.remove('on'); });
addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('on'); addImages([...e.dataTransfer.files]); });
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 9000);

(async () => {
  const paths = [...new Set([...SCENES.map(s => s.img), ...BAND_IMAGES])];
  await Promise.all(paths.map(async p => { try { IMG[p] = await load(p); } catch { } }));
  for (let i = SCENES.length - 1; i >= 0; i--) if (!IMG[SCENES[i].img]) SCENES.splice(i, 1);
  for (let i = BAND_IMAGES.length - 1; i >= 0; i--) if (!IMG[BAND_IMAGES[i]]) BAND_IMAGES.splice(i, 1);
  SCENES.forEach(completeScene);
  buildSprites();
  if (!SCENES.length) { document.body.innerHTML = '<p style="color:#ccc;font:16px system-ui;padding:40px">No images found. Add some to img/ and list them in scenes.js.</p>'; return; }
  const hour = new Date().getHours(), q = new URLSearchParams(location.search).get('scene');
  const nightIdx = SCENES.findIndex(s => !s.light), dayIdx = SCENES.findIndex(s => s.light);
  let start = q != null ? +q : (hour >= 19 || hour < 6 ? nightIdx : dayIdx);
  if (!(start >= 0 && start < SCENES.length)) start = 0;
  sceneIdx = start; scene = SCENES[start];
  layout();
  prewarm();
  const now = performance.now();
  nextCut = now + 2500; nextSceneAt = now + CFG.sceneEvery * 1000;
  addEventListener('resize', () => layout());
  requestAnimationFrame(frame);
  SCENES.forEach((s, i) => setTimeout(() => sketchOf(s), 1200 + i * 700));
})();
</script>
