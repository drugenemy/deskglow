# Publishes the wallpapers as a website, so people can try them in the browser.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ['wallpapers/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -r wallpapers/* _site/
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Deskglow</title>
          <meta http-equiv="refresh" content="0; url=ura/">
          <a href="ura/">Open the 裏 ura wallpaper</a>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
